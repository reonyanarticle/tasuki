# tasuki language pack: python
# providers.yaml が単一ソースであり、CI workflow(loop-gates.yml)はここからの射影(docs/OPERATIONS.md)。
# worker はプッシュ前に同じコマンドをローカル実行できるが、ゲートとして正となるのは CI の判定。
# デフォルトのツール選定は lint = Ruff / 整形 = Black / 型 = basedpyright / テスト = pytest。
# 対象リポジトリは repo override(.tasuki/)でコマンドを変更できる。
# 前提: 対象リポジトリの dev 依存に ruff / black / basedpyright / pytest があること(/tasuki:loop-init が確認する)。
detect: ["pyproject.toml"]

providers:
  lint:
    command: "uv run ruff check --output-format sarif --output-file ruff.sarif ."
    output: sarif
    output_file: ruff.sarif
  format:
    command: "uv run black --check ."
    output: exit-code
  typecheck:
    command: "uv run basedpyright --outputjson > basedpyright.json"
    output: json
    output_file: basedpyright.json
    normalizer: normalizers/basedpyright_json_to_sarif.py   # pyright JSON → SARIF 変換
  test:
    command: "uv run pytest --junitxml=pytest-junit.xml"
    output: junit
    output_file: pytest-junit.xml
  security:
    action: "anthropics/claude-code-security-review"  # GitHub Action として実行(docs/OPERATIONS.md)
    output: pr-comment
