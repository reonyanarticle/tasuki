# tasuki 契約プロファイル: development(開発ループ)
# スキーマの解説は docs/CONTRACTS.md を参照。
# プロジェクト固有の上書きは対象リポジトリの .tasuki/ に置く(このファイルは編集しない)。
profile: development

budgets:
  max_iterations_per_gate: 3      # 超過で人間にエスカレーション
  max_inner_loop: 5               # verifier の打ち切り上限デフォルト
  wip_limit_prs: 3                # 人間のマージ待ちの ready 親 PR の上限。超過で新規 worker 起動を停止
  stale_assignment_minutes: 60   # 停止した実行が残した assignee を回収するまでの経過時間

# モデルは agent 定義に固定されている(worker と verifier と decomposer = sonnet)。gate-reviewer のモデルは orchestrator が起動ごとに指定する。
# reviewer の差し替えは gates[].reviewer に導入先プロジェクトの agent 名を指定する。

worker_agent: tasuki-worker       # maker の差し替えキー(導入先の repo override で上書きできる)

phases:
  - name: requirements            # 親 issue
    hands_off:
      to: decomposition
  - name: decomposition
    receives:
      from: requirements
      waiting_level: "背景・目的・価値・予算が記載され、解き方は未指定"
      too_abstract_signals: ["価値の記載なし", "予算欄が空", "実現可能性の前提(必要なデータ、環境、権限)が読み取れない", "完了の定義が1回のレビューで判断できる範囲を超えている(項目過多、独立な価値の同居)"]
      too_concrete_signals: ["子タスクの実装方式まで指定"]
    hands_off:
      to: implementation
  - name: implementation
    receives:
      from: decomposition
      waiting_level: "受け入れ条件つきで単独マージ可能な単位。実装方式は未指定"
      too_abstract_signals: ["曖昧語(適切に・柔軟に等)", "受け入れ条件の欠落", "打ち切り条件の欠落", "『常に分ける』組み合わせの同居(リファクタリングと機能追加等)", "前提(必要なデータ、環境、権限)の記載なし", "非機能要件(性能・速度・実行コスト等)が該当するのに測定可能な基準として書かれていない"]
      too_concrete_signals: ["特定ライブラリ・実装方式の指定(検証の統制条件(対象の固定、比較条件、コマンドのフラグ等)は要件でありここに含めない)"]
    hands_off:
      to: report
      exit_criteria_required: true
  - name: report
    receives:
      from: implementation
      waiting_level: "要件⇔結果の対応表と結論。生データは添付リンクのみ"
      too_abstract_signals: ["対応表なし", "結論なし", "再現手順の欠落", "期待値の根拠(仕様由来)の記載なし"]
      too_concrete_signals: ["生ログ・生データの本文貼り付け", "secrets・個人情報の掲載"]
    hands_off:
      to: integration
  - name: integration             # 全子完了→親(統合ゲートが照合する昇りの最終待ち位置)
    receives:
      from: report
      waiting_level: "全親要件⇔子成果の対応が明示され、孤児の親要件が無い"
      too_abstract_signals: ["親要件の孤児(対応する子成果なし)", "対応の明示なし"]
      too_concrete_signals: ["子レポートの生転載"]

templates:                        # issue テンプレの必須欄(着手ゲートの門前払いの機械チェック対象)
  parent_issue_required_fields:
    - 背景
    - 目的
    - 価値
    - 予算(コスト上限)
    - 完了の定義
  child_issue_required_fields:
    - 対応する親要件             # 親 issue のどの要件のための子か(引用で示す)
    - 目的
    - 受け入れ条件               # AC-1、AC-2 … と採番。テストで判定できる形で書く
    - 成功基準                   # SC-1 … と採番
    - 打ち切り条件               # 反復や時間の上限。到達したら現時点の結果+残課題で終了
    - 予算(max_iterations)       # 内側ループの反復上限(有効上限= min(契約の max_inner_loop, この値))
  report_required_fields:
    - 要件⇔結果の対応表          # 受け入れ条件 AC-n と成功基準 SC-n の各項目に結果を1行で対応づける(孤児を残さない)
    - 結論                       # 成功基準を満たしたか、打ち切り条件に達したかを冒頭で言い切る
    - 期待値の根拠               # 各要件のテストの期待値が仕様(受け入れ条件)のどの記述に由来するか(実装出力を写した期待値でないことを示す)
    - 再現手順                   # コマンドと環境
    - 生データへのリンク         # 本文は集計値のみ。生データはアクセス制御されたリンクにする
    - 参照した skill と委譲した subagent   # 成果の前提を辿る(無ければ「なし」と書く)
  parent_pr_required_fields:      # 親 PR(人間が承認する唯一の PR)の必須欄
    - 何が変わるか              # 利用者に見える変化と内部の変化を分けて書く
    - 承認してほしい判断        # ループが裁量で決めたことの列挙(要件に無い決定)
    - やらなかったこと          # スコープ外に残した既知の課題
    - リスクと戻し方
    - 対応 issue
  pr_required_fields:             # 子 PR(機械が取り込む)の必須欄
    - 概要
    - 対応する親要件          # 親 issue のどの要件のための変更か
    - 受け入れ条件の充足      # AC ごとに、どの変更とテストが満たすか
    - 変更点
    - 影響範囲と revert 可否
    - 対応 issue
    - 検証方法

# 分割基準(decomposer と分割ゲートが従う。手順書側に写さない)。
split_criteria:
  good_task_conditions:           # 各子が満たす条件
    - 単独でマージして壊れない
    - テストを同梱できる
    - 単独で revert できる
    - 一読で理解できる
  always_separate:                # 必ず別の子に分ける組み合わせ
    - リファクタリングと機能追加
    - ライブラリ更新と機能開発
    - 性能改善と機能開発
    - データ移行と機能開発
    - feature flag の各段階(add → enable → remove。未完成の機能でレイヤー実行を止めないため、deploy と release は feature flag で分離する)
    - 相互に依存しない機能同士

gates:
  - id: intake
    kind: abstraction
    phase: decomposition       # 親 issue をどのフェーズへ渡すかを検める
    reviewer: gate-reviewer       # 外部 subagent 名に差し替え可能(docs/INTEGRATION.md)
    model: opus                   # 低頻度・高レバレッジ
  - id: split
    kind: abstraction
    phase: implementation      # 分割した子をどのフェーズへ渡すかを検める
    reviewer: gate-reviewer
    model: opus
    set_signals:                  # 分割の集合レベル基準(個々の子でなく分割全体を検査)
      - 依存の循環
      - 親要件の孤児(どの子 issue にも対応しない)
      - 親予算(コスト上限)との不整合(子件数・反復数の合計超過)
  - id: start
    kind: abstraction
    phase: implementation      # 子 issue をどのフェーズへ渡すかを検める
    reviewer: gate-reviewer
    model: haiku                  # 高頻度・照合型
    escalate_to: sonnet           # low-confidence PASS / 差し戻し2連続で昇格
    preflight: template-fields    # 門前払い(機械チェック)
    criteria_skills: []           # 判定基準に加える導入先プロジェクトの skill 名(任意)
  - id: checks-lint
    kind: mechanical
    provider: lint                # pack の providers.yaml を参照
    blocking_threshold: error     # SARIF level
  - id: checks-format
    kind: mechanical
    provider: format              # exit-code 判定(black --check)
  - id: checks-typecheck
    kind: mechanical
    provider: typecheck
    blocking_threshold: error
  - id: checks-test
    kind: mechanical
    provider: test                # JUnit XML: failures == 0
  - id: checks-security
    kind: mechanical
    provider: security
    blocking_threshold: high
  - id: outcome
    kind: abstraction
    phase: report              # 成果をどのフェーズへ渡すかを検める
    reviewer: gate-reviewer
    model: sonnet
    escalate_to: opus
    preflight: report-fields      # 門前払い(report_required_fields の機械チェック)
    criteria_skills: []
  - id: integration
    kind: abstraction
    phase: integration         # 統合の待ち位置
    reviewer: gate-reviewer
    model: opus

# 有効にするゲート。ここに無いゲートは判定しない(段階導入の履歴は docs/ROADMAP.md)。
enabled_gates: [intake, split, start, outcome, integration, checks-lint, checks-format, checks-typecheck, checks-test]
# checks-security はオプトイン。/tasuki:loop-init で security job を選択した場合に追加される
# (anthropics/claude-code-security-review Action。CLAUDE_API_KEY による API 課金が別途発生)

preship_review:                   # 3c 出荷前レビューのコスト制御
  mode: scaled                    # full = 常に観点別5セッション / scaled = 規模で自動選択 / manual = 人間が起動
  fanout_threshold_lines: 200     # scaled のとき、親 PR の diff がこの行数以上なら観点別に分ける

model_selection: static           # v2 で bandit(タスク複雑度ベースの動的選択)を予約

question_routing:
  task-question: issue-comment    # 起票者へ。回答で issue 本文を更新
  axis-question: contract-pr      # 契約ファイル変更 PR として起票。人間が承認
